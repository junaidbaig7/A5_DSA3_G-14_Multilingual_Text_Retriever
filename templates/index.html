<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Text Retrieval</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="hero-section">
                <h1>Multilingual Text Retriever</h1>
                <p class="tagline">A classical DSA-powered search engine for English, Spanish, and Hindi.</p>
            </div>
            <div class="search-top-row">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#7a7a85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="pen" autofocus>
                </div>
                <button class="search-btn" onclick="performSearch()">Search</button>
            </div>
            <div class="search-bottom-row">
                <select id="langFilter" class="custom-select">
                    <option value="all">Language: All ▼</option>
                    <option value="en">Language: EN</option>
                    <option value="es">Language: ES</option>
                    <option value="hi">Language: HI</option>
                </select>
                <button onclick="performSearch(true)" class="browse-btn">Browse All</button>
            </div>
            <div class="meta-info" style="display: none;">
                <span id="latency" class="latency"></span>
                <a href="/benchmark" class="benchmark-link">View Benchmarks</a>
            </div>
            <div id="correction" class="correction-note" style="display: none;"></div>
        </header>
        
        <main id="resultsContainer">
            <!-- Results will be injected here -->
        </main>
    </div>

    <script>
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch(isBrowse = false) {
            let query = document.getElementById('searchInput').value.trim();
            if (isBrowse) {
                query = '';
                document.getElementById('searchInput').value = '';
            } else if (!query) {
                return;
            }

            const lang = document.getElementById('langFilter').value;
            const resultsContainer = document.getElementById('resultsContainer');
            const latencySpan = document.getElementById('latency');
            const correctionDiv = document.getElementById('correction');
            
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            latencySpan.textContent = '';
            correctionDiv.style.display = 'none';

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}&lang=${lang}`);
                const data = await response.json();
                
                latencySpan.textContent = `Query latency: ${data.latency} ms`;
                
                if (data.corrected_query) {
                    correctionDiv.textContent = `Showing results for: ${data.corrected_query}`;
                    correctionDiv.style.display = 'block';
                }

                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">No results found.</div>';
                    return;
                }

                resultsContainer.innerHTML = data.results.map(result => `
                    <div class="result-item">
                        <div class="lang-tag-wrapper">
                            <span class="lang-tag lang-${result.lang.toLowerCase()}">${result.lang.toUpperCase()}</span>
                        </div>
                        <div class="result-content">
                            <h3 class="result-title">${result.title}</h3>
                            <p class="result-snippet">${result.snippet}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                resultsContainer.innerHTML = '<div class="error">An error occurred during search.</div>';
            }
        }
    </script>
</body>
</html>
